<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Milestones</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #f2dede;
            padding: 30px;
        }

        form {
            width: 400px;
            max-width: 90%;
            margin: 30px auto;
            text-align: left;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .home-link {
            display: inline-block;
            margin: 20px 0 30px;
        }

        #milestoneList {
            width: 400px;
            max-width: 90%;
            margin: 30px auto;
        }

        .milestone-card {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            text-align: left;
        }

        .milestone-card h3 {
            margin-top: 0;
        }

        .milestone-photo {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Milestones</h1>
        <p>Add and save important childhood milestones.</p>
    </header>

    <form id="milestoneForm">

        <label for="title">Milestone Title:</label>
        <input type="text" id="title" name="title" required>

        <br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>

        <br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description"></textarea>

        <br><br>

        <label for="photo">Photo:</label>
        <input type="file" id="photo" name="photo" accept="image/*">

        <br><br>

        <button type="submit">Save Milestone</button>

    </form>

    <section id="milestoneList">
        <h2>Saved Milestones</h2>
    </section>

    <a class="home-link" href="index.html">Back to Home</a>

    <script>
    const milestoneForm = document.getElementById("milestoneForm");
    const milestoneList = document.getElementById("milestoneList");

    // Load previously saved milestones when the page opens
    let milestones = JSON.parse(localStorage.getItem("milestones")) || [];

    function displayMilestones() {
        // Keep the section heading, but remove old cards
        milestoneList.innerHTML = "<h2>Saved Milestones</h2>";

        milestones.forEach(function(milestone) {
            const milestoneCard = document.createElement("div");
            milestoneCard.classList.add("milestone-card");

            const milestoneTitle = document.createElement("h3");
            milestoneTitle.textContent = milestone.title;

            const milestoneDate = document.createElement("p");
            milestoneDate.innerHTML =
                "<strong>Date:</strong> " + milestone.date;

            const milestoneDescription = document.createElement("p");
            milestoneDescription.textContent = milestone.description;

            milestoneCard.appendChild(milestoneTitle);
            milestoneCard.appendChild(milestoneDate);
            milestoneCard.appendChild(milestoneDescription);

            if (milestone.photo) {
                const image = document.createElement("img");
                image.src = milestone.photo;
                image.alt = milestone.title;
                image.classList.add("milestone-photo");

                milestoneCard.appendChild(image);
            }

            milestoneList.appendChild(milestoneCard);
        });
    }

    milestoneForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const title = document.getElementById("title").value;
        const date = document.getElementById("date").value;
        const description = document.getElementById("description").value;
        const photo = document.getElementById("photo").files[0];

        if (photo) {
            const reader = new FileReader();

            reader.onload = function(event) {
                saveMilestone(
                    title,
                    date,
                    description,
                    event.target.result
                );
            };

            reader.readAsDataURL(photo);
        } else {
            saveMilestone(
                title,
                date,
                description,
                null
            );
        }
    });

    function saveMilestone(title, date, description, photo) {
        const newMilestone = {
            title: title,
            date: date,
            description: description,
            photo: photo
        };

        milestones.push(newMilestone);

        localStorage.setItem(
            "milestones",
            JSON.stringify(milestones)
        );

        displayMilestones();

        milestoneForm.reset();
    }

    // Display saved milestones immediately
    displayMilestones();
</script>

</body>
</html>
